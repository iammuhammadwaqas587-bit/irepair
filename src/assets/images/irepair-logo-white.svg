<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 144" width="520" height="144" fill="none">
  <!-- 1. CROSSED TOOLS ICON (Left Graphic in Pure White) -->
  <g transform="translate(74, 72)">
    <!-- Screwdriver (Top-Left to Bottom-Right, 45 deg) -->
